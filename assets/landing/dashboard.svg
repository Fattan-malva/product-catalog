<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="Animated analytics bars for the Flutter admin dashboard">
<style>
:root{--bg:#ffffff;--card:#f8fafc;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#4f46e5;--bar:#c7d2fe}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#111827;--ink:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--accent:#818cf8;--bar:#312e81}}
.frame{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.bar{fill:var(--bar);transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s ease-out both}
.bar.hi{fill:var(--accent)}
.lbl{font:500 12px system-ui,sans-serif;fill:var(--muted)}
.big{font:600 26px system-ui,sans-serif;fill:var(--ink)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect width="960" height="240" fill="var(--bg)"/>
<rect class="frame" x="20" y="20" width="920" height="200" rx="14"/>
<text class="lbl" x="48" y="58">Revenue overview</text>
<text class="big" x="48" y="94">Dashboard layout</text>
<g>
<rect class="bar" style="animation-delay:.05s" x="500" y="110" width="28" height="80" rx="4"/>
<rect class="bar" style="animation-delay:.12s" x="540" y="90" width="28" height="100" rx="4"/>
<rect class="bar hi" style="animation-delay:.19s" x="580" y="70" width="28" height="120" rx="4"/>
<rect class="bar" style="animation-delay:.26s" x="620" y="100" width="28" height="90" rx="4"/>
<rect class="bar" style="animation-delay:.33s" x="660" y="80" width="28" height="110" rx="4"/>
<rect class="bar hi" style="animation-delay:.40s" x="700" y="60" width="28" height="130" rx="4"/>
<rect class="bar" style="animation-delay:.47s" x="740" y="95" width="28" height="95" rx="4"/>
<rect class="bar" style="animation-delay:.54s" x="780" y="75" width="28" height="115" rx="4"/>
<rect class="bar hi" style="animation-delay:.61s" x="820" y="50" width="28" height="140" rx="4"/>
</g>
<line x1="48" y1="190" x2="912" y2="190" stroke="var(--line)" stroke-width="1"/>
<text class="lbl" x="48" y="205">Demo data. Dashboard tables, users, and charts are placeholders.</text>
</svg>

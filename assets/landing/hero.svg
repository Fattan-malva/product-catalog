<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="Malvaa">
<style>
:root{--bg:#ffffff;--ink:#14201d;--muted:#5b6b66;--accent:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1816;--ink:#e6f2ef;--muted:#9db5ae;--accent:#5eead4}}
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.word{font-size:92px;font-weight:700;letter-spacing:-3px;fill:var(--ink);opacity:0;animation:fade .9s ease-out forwards}
.tag{font-size:19px;font-weight:400;fill:var(--muted);opacity:0;animation:fade .9s ease-out .9s forwards}
.rule{stroke:var(--accent);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1s ease-out .5s forwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.word,.tag,.rule{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<rect width="960" height="240" fill="var(--bg)"/>
<text class="word" x="480" y="120" text-anchor="middle">Malvaa</text>
<path class="rule" d="M380 150 H580"/>
<text class="tag" x="480" y="190" text-anchor="middle">Developer tools, UI kits, and starter projects</text>
</svg>
